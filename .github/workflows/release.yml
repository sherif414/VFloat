name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic release bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry-run simulation (no git push, GitHub release, or npm publish)"
        required: false
        default: false
        type: boolean
      skip_github_release:
        description: "Publish to npm without creating a GitHub Release"
        required: false
        default: false
        type: boolean
      skip_npm:
        description: "Create GitHub Release and tag without publishing to npm"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Release to GitHub & npm
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Update npm to latest for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium with system dependencies (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run lint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test

      - name: Build package
        run: pnpm run build

      - name: Execute Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./scripts/release/ci-release.mjs \
            --type=${{ inputs.release_type }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.skip_github_release && '--skip-github-release' || '' }} \
            ${{ inputs.skip_npm && '--skip-npm' || '' }}
